name: Build and Release C Libraries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build C Libraries and Create Release
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libomp-dev
    
    - name: Build C libraries
      run: |
        make clean
        make
    
    - name: Prepare artifacts
      run: |
        mkdir -p release_libs
        cp libdna_sequential.so release_libs/libdna_sequential_linux_x86_64.so
        cp libdna_parallel.so release_libs/libdna_parallel_linux_x86_64.so
        echo "Libraries prepared:"
        ls -lh release_libs/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release_libs/*.so
        generate_release_notes: true
        body: |
          # Pre-compiled C Libraries for biocomputing_core ${{ github.ref_name }}
          
          These are the pre-compiled shared object files (`.so`) for the DNA sequence generator library.
          
          ## Files Included
          - `libdna_sequential_linux_x86_64.so` - Sequential DNA sequence generator
          - `libdna_parallel_linux_x86_64.so` - Parallel DNA sequence generator (OpenMP)
          
          ## Usage
          The Python `biocomputing` package automatically downloads these libraries during installation:
          ```bash
          pip install biocomputing
          ```
          
          ## Platform
          - **OS:** Linux
          - **Architecture:** x86_64
          - **Build Date:** ${{ github.event.head_commit.timestamp }}
          - **Commit:** ${{ github.sha }}
          
          **Repository:** https://github.com/sigdelsanjog/biocomputing_core
